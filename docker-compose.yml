services:
    nginx:
        image: nginx:1.25-alpine
        volumes:
            - .:/var/www/app:delegated
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - '80'
        depends_on:
            - php
            # - php_xdebug

    php: &php
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/app
        volumes:
            - $HOME/.composer/:/.composer/:delegated
            - .:/var/www/app:delegated
        env_file:
            - .env
            - .env.dev
        environment:
            - DEST_HOME=/var/www/app
            # - DATABASE_URL=mysql://root:root@db:3306/reg121_homepage?serverVersion=mariadb-11.0.6&charset=utf8mb4
        depends_on:
            - redis
            - database
            - mailhog

    redis:
        image: redis:7.0-alpine
        user: 1000:1000
        command: ['redis-server', '--save ""', '--appendonly no']

    node:
        image: node:20-alpine
        volumes:
            - .:/app:delegated
            - $HOME/.cache/yarn:/home/node/.cache/yarn:delegated
        working_dir: /app
        user: 1000:1000
        command: tail -f /dev/null

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - '8025:8025'  # Web UI
            - '1025:1025'  # SMTP

    database:
        image: mariadb:11.0
        ports:
            - '3306'
        command: --max_allowed_packet=500M
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: sundial
        volumes:
            - ./var/mysql:/var/lib/mysql